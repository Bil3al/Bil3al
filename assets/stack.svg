<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="666" viewBox="0 0 1200 666" role="img" aria-labelledby="title desc">
<title id="title">Stack technique de Bilal Malih — six domaines</title>
<desc id="desc">Identité de Bilal Malih : développement full stack, intelligence artificielle et systèmes RAG.</desc>
<defs>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a6b5bd" stroke-opacity=".07"/></pattern>
 <radialGradient id="glow"><stop stop-color="#70e1e8" stop-opacity=".16"/><stop offset="1" stop-color="#70e1e8" stop-opacity="0"/></radialGradient>
 <style>
 text{font-family:'Segoe UI',Arial,sans-serif} .mono{font-family:Consolas,monospace;letter-spacing:2px}
 .orbit{transform-origin:968px 244px;animation:orbit 40s linear infinite}
 .flow{stroke-dasharray:6 10;animation:flow 4s linear infinite}
 .pulse{animation:pulse 4s ease-in-out infinite}
 @keyframes orbit{to{transform:rotate(360deg)}}
 @keyframes flow{to{stroke-dashoffset:-96}}
 @keyframes pulse{50%{opacity:.4}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important}}
 </style>
</defs>
<rect width="1200" height="666" rx="18" fill="#0b181e"/>
<rect width="1200" height="666" rx="18" fill="url(#grid)"/>
<text x="40" y="49" font-size="14" fill="#dcfa73" font-weight="600" class="mono">01 / CAPABILITY ATLAS</text><text x="40" y="96" font-size="35" fill="#f1f4e9" font-weight="700" >Du produit au modèle.</text><text x="1160" y="96" font-size="12" fill="#a6b5bd" font-weight="400" class="mono" text-anchor="end">UNE STACK, PLUSIEURS DIMENSIONS</text><rect x="40" y="130" width="552" height="158" fill="#12232b" stroke="#30434b" rx="12"/><text x="60" y="163" font-size="13" fill="#70e1e8" font-weight="400" class="mono">01</text><text x="102" y="165" font-size="23" fill="#f1f4e9" font-weight="650" >Backend &amp; Architecture</text><path d="M60 183H572" stroke="#30434b" fill="none" /><text x="60" y="214" font-size="18" fill="#a6b5bd" font-weight="400" >Java 21 · Spring Boot · FastAPI</text><text x="60" y="239" font-size="18" fill="#a6b5bd" font-weight="400" >Spring Security · REST · gRPC</text><rect x="608" y="130" width="552" height="158" fill="#12232b" stroke="#30434b" rx="12"/><text x="628" y="163" font-size="13" fill="#70e1e8" font-weight="400" class="mono">02</text><text x="670" y="165" font-size="23" fill="#f1f4e9" font-weight="650" >Frontend &amp; Realtime</text><path d="M628 183H1140" stroke="#30434b" fill="none" /><text x="628" y="214" font-size="18" fill="#a6b5bd" font-weight="400" >React · TypeScript · JavaScript</text><text x="628" y="239" font-size="18" fill="#a6b5bd" font-weight="400" >WebSocket · HTML · CSS · PWA</text><rect x="40" y="304" width="552" height="158" fill="#12232b" stroke="#30434b" rx="12"/><text x="60" y="337" font-size="13" fill="#70e1e8" font-weight="400" class="mono">03</text><text x="102" y="339" font-size="23" fill="#f1f4e9" font-weight="650" >Agentic AI &amp; Retrieval</text><path d="M60 357H572" stroke="#30434b" fill="none" /><text x="60" y="388" font-size="18" fill="#a6b5bd" font-weight="400" >Python · LangGraph · Ollama</text><text x="60" y="413" font-size="18" fill="#a6b5bd" font-weight="400" >RAG · BM25 · Reranking · DeBERTa</text><rect x="608" y="304" width="552" height="158" fill="#12232b" stroke="#30434b" rx="12"/><text x="628" y="337" font-size="13" fill="#70e1e8" font-weight="400" class="mono">04</text><text x="670" y="339" font-size="23" fill="#f1f4e9" font-weight="650" >Data &amp; Vector Search</text><path d="M628 357H1140" stroke="#30434b" fill="none" /><text x="628" y="388" font-size="18" fill="#a6b5bd" font-weight="400" >PostgreSQL · MySQL · MongoDB</text><text x="628" y="413" font-size="18" fill="#a6b5bd" font-weight="400" >Redis · Neo4j · Qdrant · ChromaDB</text><rect x="40" y="478" width="552" height="158" fill="#12232b" stroke="#30434b" rx="12"/><text x="60" y="511" font-size="13" fill="#70e1e8" font-weight="400" class="mono">05</text><text x="102" y="513" font-size="23" fill="#f1f4e9" font-weight="650" >Platform &amp; Observability</text><path d="M60 531H572" stroke="#30434b" fill="none" /><text x="60" y="562" font-size="18" fill="#a6b5bd" font-weight="400" >Docker · Kubernetes · Helm · Trivy</text><text x="60" y="587" font-size="18" fill="#a6b5bd" font-weight="400" >Prometheus · Loki · Jenkins · CI/CD</text><rect x="608" y="478" width="552" height="158" fill="#12232b" stroke="#30434b" rx="12"/><text x="628" y="511" font-size="13" fill="#70e1e8" font-weight="400" class="mono">06</text><text x="670" y="513" font-size="23" fill="#f1f4e9" font-weight="650" >Engineering Practices</text><path d="M628 531H1140" stroke="#30434b" fill="none" /><text x="628" y="562" font-size="18" fill="#a6b5bd" font-weight="400" >POO · SOLID · Design Patterns</text><text x="628" y="587" font-size="18" fill="#a6b5bd" font-weight="400" >Microservices · JUnit · Git · Jira</text><text x="628" y="612" font-size="18" fill="#a6b5bd" font-weight="400" >Agile · Travail en équipe</text>

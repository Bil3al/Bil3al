<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
<title id="title">Collaborer avec Bilal Malih — full stack et IA appliquée</title>
<desc id="desc">Identité de Bilal Malih : développement full stack, intelligence artificielle et systèmes RAG.</desc>
<defs>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a6b5bd" stroke-opacity=".07"/></pattern>
 <radialGradient id="glow"><stop stop-color="#70e1e8" stop-opacity=".16"/><stop offset="1" stop-color="#70e1e8" stop-opacity="0"/></radialGradient>
 <style>
 text{font-family:'Segoe UI',Arial,sans-serif} .mono{font-family:Consolas,monospace;letter-spacing:2px}
 .orbit{transform-origin:968px 244px;animation:orbit 40s linear infinite}
 .flow{stroke-dasharray:6 10;animation:flow 4s linear infinite}
 .pulse{animation:pulse 4s ease-in-out infinite}
 @keyframes orbit{to{transform:rotate(360deg)}}
 @keyframes flow{to{stroke-dashoffset:-96}}
 @keyframes pulse{50%{opacity:.4}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important}}
 </style>
</defs>
<rect width="1200" height="250" rx="18" fill="#0b181e"/>
<rect width="1200" height="250" rx="18" fill="url(#grid)"/>
<text x="40" y="47" font-size="14" fill="#dcfa73" font-weight="600" class="mono">BUILD SOMETHING MEANINGFUL.</text><text x="40" y="103" font-size="36" fill="#f1f4e9" font-weight="700" >Une idée complexe. Une solution élégante.</text><text x="40" y="149" font-size="22" fill="#a6b5bd" font-weight="400" >Construisons des systèmes intelligents, accessibles et utiles.</text><path d="M40 181H1160" stroke="#30434b" fill="none" /><text x="40" y="217" font-size="13" fill="#70e1e8" font-weight="400" class="mono">BILAL MALIH / BIL3AL</text><text x="1160" y="217" font-size="13" fill="#dcfa73" font-weight="400" class="mono" text-anchor="end">FULL STACK × APPLIED AI</text>
</svg>